[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nommogramme"
version = "0.6.0"
description = "Résistance au feu de profilés métalliques par la méthode du nomogramme (SIA 263 / EN 1993-1-2)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
word = ["python-docx>=1.1", "latex2mathml>=3.77", "mathml2omml>=0.0.2"]
trace = ["matplotlib>=3.7"]
ui = ["streamlit>=1.30", "matplotlib>=3.7", "python-docx>=1.1", "latex2mathml>=3.77", "mathml2omml>=0.0.2"]
bureau = ["matplotlib>=3.7", "python-docx>=1.1", "latex2mathml>=3.77", "mathml2omml>=0.0.2"]
dev = ["pytest>=7.4", "openpyxl>=3.1", "matplotlib>=3.7", "streamlit>=1.30", "python-docx>=1.1", "latex2mathml>=3.77", "mathml2omml>=0.0.2"]

[project.scripts]
nommo = "nommogramme.cli:main"

[project.gui-scripts]
nommo-bureau = "nommogramme.interface:lancer_bureau"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nommogramme = ["data/*.csv", "data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
