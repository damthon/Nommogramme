# Cas de référence — vérifications dont le résultat est connu par ailleurs.
#
# C'est ici que se déposent VOS cas déjà dimensionnés par un autre moyen :
# abaque SZS papier, logiciel du bureau, feuille de calcul existante, exemple
# d'un recueil. Chaque cas ajouté devient un test de non-régression.
#
# Champs obligatoires : libelle, source, profil, exposition, duree_min, et au
# moins une valeur dans [cas.attendu].
#
# Champs de chargement (tous facultatifs, valeur par défaut nulle) :
#   N_fi_Ed_kN     effort normal, POSITIF EN COMPRESSION
#   My_fi_Ed_kNm   moment autour de l'axe fort
#   Mz_fi_Ed_kNm   moment autour de l'axe faible
#   L              longueur d'épure [m]
#   l_fi_y, l_fi_z longueurs de flambement en situation d'incendie [m]
#   L_LT           longueur de déversement [m]
#   beta_M         facteur de moment uniforme équivalent
#   maintien_lateral   true si la semelle comprimée est bloquée
#   kappa_1, kappa_2   facteurs d'adaptation du §4.2.3.3
#
# Protection (facultative) :
#   protection     identifiant dans protections.toml
#   dp_mm          épaisseur
#
# Autres : nuance (défaut S355), feu (défaut iso834), contexte (défaut sia).
#
# Valeurs vérifiables dans [cas.attendu] :
#   mu_0, theta_cr, theta_cr_nomogramme, theta_cr_exact,
#   Am_sur_V, k_sh, theta_a_a_echeance, t_fi_d_min, verdict
#
# `tolerance` est l'écart relatif admis (défaut 0,02). `verdict` se compare
# exactement : "satisfait" ou "non satisfait".

# ---------------------------------------------------------------------------
# RÉFÉRENCE EXTERNE
# ---------------------------------------------------------------------------

[[cas]]
libelle = "Durchlaufende HEA Stütze — steelacademy 2019"
source = "steelacademy 2019, Horw, 12.09.2019, Dr. P. R. Schulthess, planches 36-39"
reference_externe = true
profil = "HEA 300"
nuance = "S235"
N_fi_Ed_kN = 1205.0
L = 3.0
l_fi_y = 1.5
l_fi_z = 1.5
exposition = "caisson4"
protection = "plaques_silicate"
dp_mm = 20.0
duree_min = 90.0
tolerance = 0.02
[cas.attendu]
Am_sur_V = 104.0
theta_cr = 580.0
t_fi_d_min = 111.0
verdict = "satisfait"

[[cas]]
libelle = "Poteau HEB 360 non revêtu — steelacademy 2019"
source = "steelacademy 2019, Lausanne, 25.09.2019, Dr. R. Bärtschi, planches 22-23"
reference_externe = true
profil = "HEB 360"
nuance = "S355"
N_fi_Ed_kN = 537.0
L = 4.0
l_fi_y = 4.0
l_fi_z = 4.0
exposition = "contour4"
duree_min = 30.0
tolerance = 0.02
[cas.attendu]
Am_sur_V = 102.0
k_sh = 0.642
theta_a_a_echeance = 730.0

# Deux mises en garde sur ce cas.
#
# 1. La planche lit θ = 770 °C à 30 min ; l'outil donne 730 °C. L'écart tient
#    entièrement au facteur d'ombre : la planche entre dans le nomogramme avec
#    A_m/V = 102 m⁻¹, l'outil avec k_sh·A_m/V = 65,6 m⁻¹ (§4.2.5.1(2)). Nourri
#    de la même entrée, l'outil retrouve 770,5 °C — voir
#    tests/test_reference_bartschi.py. Seule la valeur de l'outil est figée ici.
#
# 2. N est pris égal à la capacité résiduelle que la planche calcule (537 kN),
#    non à une charge d'énoncé : la question posée est « que reste-t-il ? », pas
#    « est-ce que ça tient ? ». Aucun verdict n'est donc attendu.

# Le degré d'utilisation n'est PAS vérifié ici : la planche donne μ = 0,60,
# calculé avec la longueur de flambement à température ambiante, alors que le
# §4.2.4 le rapporte à la résistance avec l_fi. L'outil affiche donc 0,52.
# Les deux conventions mènent à la même température critique — voir
# tests/test_reference_szs.py.

[[cas]]
libelle = "Solive IPE 300 revêtue R90 — steeltec 02:2015, exemple B"
source = "SZS steeltec 02:2015, ch. 3.2, p. 31"
reference_externe = true
profil = "IPE 300"
nuance = "S235"
My_fi_Ed_kNm = 67.5
L = 9.0
maintien_lateral = true
kappa_1 = 0.7
exposition = "caisson3"
protection = "plaques_silicate"
dp_mm = 18.0
duree_min = 90.0
tolerance = 0.02
[cas.attendu]
mu_0 = 0.319
theta_cr_nomogramme = 654.0
Am_sur_V = 139.0
verdict = "satisfait"

# Le premier cas de FLEXION validé contre une source externe. Il fixe aussi la
# convention d'entrée du nomogramme : mu_0 = mu_fi,t * kappa = 0,456 * 0,7.

[[cas]]
libelle = "Poteau HEB 340 nu, l_fi = 0,7·L — steeltec 02:2015, exemple G"
source = "SZS steeltec 02:2015, ch. 3.7, p. 33"
reference_externe = true
profil = "HEB 340"
nuance = "S235"
N_fi_Ed_kN = 760.0
L = 4.0
l_fi_y = 2.8
l_fi_z = 2.8
exposition = "contour4"
duree_min = 25.0
tolerance = 0.02
[cas.attendu]
theta_cr = 683.0
Am_sur_V = 105.0
t_fi_d_min = 25.0
verdict = "satisfait"

# C'est l'exemple qui tranche la question du facteur d'ombre : le document
# calcule [A_m/V]_sh = 0,9 * [A_m/V]_b = 0,9 * 74 = 67 m-1 avant de lire la
# durée, exactement comme cet outil.
#
# mu_0 n'est pas vérifié, pour la même raison que le cas HEA 300 ci-dessus :
# le document donne 0,28 avec L_K,0 = 4,0 m, l'outil 0,245 avec l_fi = 2,8 m.
# Les deux mènent à la même température critique.

# ---------------------------------------------------------------------------
# Les cas ci-dessous ne sont PAS des références externes : ce sont les valeurs
# produites par l'outil lui-même, figées pour détecter toute régression. Ils
# n'attestent en rien de la justesse du calcul — voir docs/validation.md.
# Les remplacer par de vraies références vérifiées est l'objectif.
# ---------------------------------------------------------------------------

