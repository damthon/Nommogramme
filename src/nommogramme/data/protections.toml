# Base de matériaux de protection incendie.
#
# ATTENTION — valeurs génériques d'ordre de grandeur, tirées de la littérature
# technique. Elles servent au développement, aux tests et aux études de
# faisabilité. Toute étude de projet doit utiliser les valeurs de l'agrément
# technique du produit retenu (ETE, reconnaissance AEAI).
#
# Les fiches portant un champ « source » proviennent d'une publication
# identifiée ; les autres restent des ordres de grandeur.
#
# lambda_p : conductivité thermique [W/m·K]
# rho_p    : masse volumique [kg/m³]
# c_p      : chaleur spécifique [J/kg·K]
# dp_min   : épaisseur usuelle minimale [m]
# dp_max   : épaisseur usuelle maximale [m]
# pose     : "contour" (suit la forme du profilé) ou "caisson" (encaissement)
# beta_n_mm_min : vitesse de carbonisation fictive [mm/min], pour un produit
#                 combustible seulement (EN 1995-1-2 §3.4.2, tab. 3.1)

[flocage_fibreux]
libelle = "Flocage fibreux (laine minérale projetée)"
lambda_p = 0.12
rho_p = 300.0
c_p = 1200.0
dp_min = 0.010
dp_max = 0.050
pose = "contour"

[flocage_pateux]
libelle = "Flocage pâteux (vermiculite-ciment)"
lambda_p = 0.15
rho_p = 550.0
c_p = 1100.0
dp_min = 0.010
dp_max = 0.050
pose = "contour"

[plaques_platre]
libelle = "Plaques de plâtre coupe-feu (type F)"
lambda_p = 0.20
rho_p = 800.0
c_p = 1700.0
dp_min = 0.0125
dp_max = 0.050
pose = "caisson"

[plaques_silicate]
libelle = "Plaques de fibres-silicate de calcium"
source = "SZS steeldoc tec 02, Abb. 50"
lambda_p = 0.15
rho_p = 600.0
c_p = 1200.0
dp_min = 0.015
dp_max = 0.050
pose = "caisson"

[laine_de_roche]
libelle = "Panneaux de laine de roche"
lambda_p = 0.12
rho_p = 150.0
c_p = 1200.0
dp_min = 0.020
dp_max = 0.060
pose = "caisson"

# Protection combustible : moulage négatif du profilé en lamellé-collé, face
# extérieure rectangulaire. d_p est l'enrobage minimal de bois devant l'acier.
# Valeurs constantes retenues sur la plage du bois sain (20 à 300 °C), du côté
# défavorable — voir docs/references.md :
#   lambda_p : 0,15, maximum de l'EN 1995-1-2 annexe B, tab. B.1
#   c_p      : 1530, valeur à 20 °C hors pic d'évaporation, tab. B.2
#   rho_p    : 385, rho_g,k du GL24h, EN 14080 tab. 5
#   beta_n   : 0,7 mm/min, EN 1995-1-2 tab. 3.1, arrondis de coins inclus
[bois_lamelle_colle]
libelle = "Bois lamellé-collé GL24h (moulage, combustible)"
lambda_p = 0.15
rho_p = 385.0
c_p = 1530.0
dp_min = 0.040
dp_max = 0.120
pose = "caisson"
beta_n_mm_min = 0.7
